<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;background:#0d0d0d;color:#ccc;min-height:100vh}
.header{background:#1a1a1a;border-bottom:1px solid #2a2a2a;padding:12px 24px;display:flex;align-items:center;gap:12px}
.header a{color:#888;text-decoration:none;font-size:13px}
.header a:hover{color:#fff}
.header h1{font-size:18px;color:#fff}
.main{max-width:1200px;margin:0 auto;padding:24px}
.search-bar{display:flex;gap:12px;margin-bottom:24px}
.search-bar input{flex:1;padding:12px 16px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:15px}
.search-bar input:focus{outline:none;border-color:#0f3460}
.search-bar button{padding:12px 28px;background:#0f3460;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.search-bar button:hover{background:#1a5276}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color 0.2s}
.card:hover{border-color:#0f3460}
.card img{width:100%;height:160px;object-fit:cover}
.card .info{padding:12px}
.card .info .dur{font-size:12px;color:#888;margin-bottom:4px}
.card .info .size{font-size:11px;color:#666}
.card .actions{padding:0 12px 12px;display:flex;gap:8px}
.card .actions button{padding:6px 14px;border:1px solid #333;border-radius:6px;background:transparent;color:#aaa;font-size:12px;cursor:pointer;transition:all 0.2s}
.card .actions button:hover{background:#0f3460;border-color:#0f3460;color:#fff}
.preview-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:1000;justify-content:center;align-items:center}
.preview-overlay video{max-width:90%;max-height:80%;border-radius:8px}
.preview-overlay .close{position:absolute;top:20px;right:24px;color:#fff;font-size:32px;cursor:pointer}
.loading{text-align:center;padding:40px;color:#666;font-size:14px}
.empty{text-align:center;padding:60px;color:#555}
</style>

.ct-unibar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:#544736;color:#f4ecdc;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;border-bottom:3px solid #2a251f;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.ct-unibar__brand{font-weight:700;letter-spacing:.05em;color:#f4ecdc}

<div class="header"><h1>🔍 Pixabay 视频搜索</h1>
</div>

<div class="main">
  <div class="search-bar">
    <input type="text" id="q" placeholder="输入关键词搜索免费视频素材..." onkeydown="if(event.key==='Enter')search()">
    <button onclick="search()">搜索</button>
  </div>
  <div class="grid" id="results"></div>
  <div class="empty" id="empty">🔍 输入关键词开始搜索</div>
</div>

<div class="preview-overlay" id="preview" onclick="closePreview()">
  <span class="close">&times;</span>
  <video id="player" controls autoplay></video>
</div>

<script>
const API = '/api-studio';

async function search(){
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  document.getElementById('results').innerHTML = '<div class="loading">搜索中...</div>';
  document.getElementById('empty').style.display = 'none';
  try {
    const r = await fetch(API+'/search?q='+encodeURIComponent(q));
    const d = await r.json();
    if(!d.results || d.results.length===0){
      document.getElementById('results').innerHTML = '';
      document.getElementById('empty').style.display = 'block';
      document.getElementById('empty').textContent = '😕 没有找到相关视频';
      return;
    }
    document.getElementById('results').innerHTML = d.results.map(v => `
      <div class="card" onclick="preview('${v.url}')">
        ${v.thumbnail ? `<img src="${v.thumbnail}" loading="lazy" onerror="this.style.display='none'">` : ''}
        <div class="info">
          <div class="dur">⏱ ${v.duration}s</div>
          <div class="size">${v.width}×${v.height}</div>
        </div>
        <div class="actions">
          <button onclick="event.stopPropagation();preview('${v.url}')">▶ 预览</button>
          <button onclick="event.stopPropagation();download('${v.url}')">⬇ 下载</button>
        </div>
      </div>
    `).join('');
  } catch(e){
    document.getElementById('results').innerHTML = '<div class="loading">❌ 搜索失败: '+e.message+'</div>';
  }
}

function preview(url){
  const ov = document.getElementById('preview');
  const v = document.getElementById('player');
  v.src = url;
  ov.style.display = 'flex';
  v.play();
}

function closePreview(){
  document.getElementById('preview').style.display = 'none';
  document.getElementById('player').pause();
}

async function download(url){
  try{
    const r = await fetch(API+'/download',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'url='+encodeURIComponent(url)});
    const d = await r.json();
    window.open(d.url);
  }catch(e){ alert('下载失败: '+e.message); }
}
</script>
