*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;background:#0d0d0d;color:#ccc;min-height:100vh}
.header{background:#1a1a1a;border-bottom:1px solid #2a2a2a;padding:12px 24px;display:flex;align-items:center;gap:12px}

.left{flex:1;min-width:0}
.right{width:300px;flex-shrink:0;position:sticky;top:20px;align-self:flex-start}
.panel{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:16px;margin-bottom:12px}
.panel h2{font-size:14px;color:#fff;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.row label{font-size:12px;color:#888;min-width:50px}
textarea{width:100%;height:120px;background:#0f0f0f;border:1px solid #333;border-radius:8px;color:#fff;font-size:13px;padding:10px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:#0f3460}
input,select{padding:6px 10px;background:#0f0f0f;border:1px solid #333;border-radius:6px;color:#fff;font-size:12px}
.btn{padding:8px 16px;border:none;border-radius:6px;font-size:13px;cursor:pointer}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-primary{background:#0f3460;color:#fff}
.btn-success{background:#27ae60;color:#fff;padding:12px 0;width:100%;font-size:15px}
.btn-danger{background:#c0392b;color:#fff}
.btn-sm{padding:4px 8px;font-size:11px}
/* Canvas */
.canvas-wrap{background:#111;border-radius:8px;padding:8px;position:relative;overflow:hidden}
canvas{display:block;width:100%;border-radius:4px;background:#000}
.canvas-toolbar{display:flex;gap:4px;margin-top:6px;font-size:11px;color:#666;justify-content:space-between}
/* Text box list */
.box-item{background:#0f0f0f;border:1px solid #222;border-radius:8px;padding:10px;margin-bottom:6px}
.box-item.selected{border-color:#0f3460}
.box-item .row{margin-bottom:4px}
.color-dot{width:18px;height:18px;border-radius:50%;border:1px solid #444;cursor:pointer}
.upload-zone{border:2px dashed #333;border-radius:8px;padding:20px;text-align:center;cursor:pointer;margin:8px 0}
.upload-zone:hover{border-color:#0f3460}
.progress{width:100%;height:4px;border-radius:2px;margin:8px 0}
.progress::-webkit-progress-bar{background:#222;border-radius:2px}
.progress::-webkit-progress-value{background:#0f3460;border-radius:2px}
.log-box{background:#0f0f0f;border-radius:6px;padding:8px;max-height:150px;overflow-y:auto;font:12px monospace;color:#888;white-space:pre-wrap}
.step{display:inline-flex;padding:3px 10px;border-radius:12px;font-size:11px;background:#222;color:#666;margin:2px}
.step.active{background:#0f3460;color:#fff}
.step.done{background:#1a3a1a;color:#27ae60}
.step.error{background:#3a1a1a;color:#e74c3c}
.elem-badge{font-size:10px;padding:2px 6px;border-radius:8px;background:#e67e22;color:#fff;margin-left:4px}

<div class="header">

</div>
<div class="main">
<div class="left">
  <!-- 文案 -->
  <div class="panel"><h2>📝 口播文案</h2>
    <textarea id="script" placeholder="粘贴你的文案..."></textarea>
    <div class="row" style="margin-top:8px">
      <label>配音</label><select id="ttsProvider"><option value="edge-tts">Edge TTS</option><option value="indextts">IndexTTS 声音克隆</option></select>
      <select id="ttsVoice"><option value="zh-CN-YunxiNeural">云希</option><option value="zh-CN-YunyangNeural">云扬</option><option value="zh-CN-XiaoxiaoNeural">晓晓</option></select>
    </div>
    <div id="steps"></div>
    <progress class="progress" id="progressBar" value="0" max="100"></progress>
    <button class="btn btn-success" id="startBtn" onclick="startPipeline()">🚀 一键生成</button>
    <div class="log-box" id="logBox"></div>
  </div>

  <!-- 上传 -->
  <div class="panel"><h2>🖼️ 背景图 & 素材视频</h2>
    <div class="row">
      <label>背景图</label>
      <input type="file" id="bgFile" accept="image/*" onchange="uploadBg()">
      <span style="font-size:11px;color:#666" id="bgStatus">未上传</span>
    </div>
    <div class="row">
      <label>素材视频</label>
      <input type="file" id="matFile" accept="video/*" onchange="uploadMat()">
      <span style="font-size:11px;color:#666" id="matStatus">未上传</span>
    </div>
  </div>

  <!-- 文本框 -->
  <div class="panel"><h2>✏️ 文本框</h2>
    <div id="boxList"></div>
    <button class="btn btn-primary btn-sm" onclick="addTextBox()">+ 添加文本框</button>
  </div>
</div>

<div class="right">
  <!-- 预览 -->
  <div class="panel"><h2>👁️ 预览</h2>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="preview" width="1440" height="2560"></canvas>
    </div>
    <div class="canvas-toolbar">
      <span id="canvasInfo">0,0 | 1440×2560</span>
      <span style="color:#f39c12;font-size:10px">原点=画布中心</span>
    </div>
  </div>

  <!-- 字幕设置 -->
  <div class="panel"><h2>💬 字幕</h2>
    <div class="row"><label>X</label><input type="number" id="subX" value="0" style="width:80px"> <span style="font-size:11px;color:#888">中心原点</span></div>
    <div class="row"><label>Y</label><input type="number" id="subY" value="1000" style="width:80px"> <span style="font-size:11px;color:#888">距顶像素</span></div>
  </div>

  <!-- 选中元素属性 -->
  <div class="panel" id="propPanel" style="display:none"><h2>📐 属性</h2>
    <div id="propContent"></div>
  </div>
</div>
</div>

<script>
const API = '/api-studio';
const W=1440, H=2560, CX=W/2, CY=H/2, SNAP=12;

// ── State ──
let bgUrl='', matUrl='', matBgId='', audioUrl='', srtUrl='';
let textBoxes = [];
let matX=0, matY=0;  // material video position (center-origin)
let selectedType = '';  // 'text' or 'mat'
let selectedIdx = -1;
let dragType='', dragIdx=-1, dragOX=0, dragOY=0, isDragging=false;
let guideState = null;  // null | 'x' | 'y' | 'both' — center snap guides

// ── Canvas helpers ──
const canvas = document.getElementById('preview');

function toCanvasX(cx){ return CX + cx; }  // center-origin → canvas pixel
function toCanvasY(cy){ return CY + cy; }

function drawPreview(){
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);

  // Draw center crosshair (subtle)
  ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(CX,0); ctx.lineTo(CX,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,CY); ctx.lineTo(W,CY); ctx.stroke();

  // Background image
  if(bgUrl){
    const img = bgCache[bgUrl];
    if(img) ctx.drawImage(img,0,0,W,H);
  }

  // Material video
  if(matUrl){
    const mw=W, mh=Math.round(W*9/16);
    const mx=toCanvasX(matX) - mw/2, my=toCanvasY(matY) - mh/2;
    ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=2;
    ctx.strokeRect(mx,my,mw,mh);
    ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.fillRect(mx,my,mw,mh);
    ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.font='22px sans-serif';
    ctx.textAlign='center'; ctx.fillText('🎬 素材视频 16:9', mx+mw/2, my+mh/2);

    // Selection border
    if(selectedType==='mat'){
      ctx.strokeStyle='#e67e22'; ctx.lineWidth=3;
      ctx.strokeRect(mx-2,my-2,mw+4,mh+4);
    }
  }

  // Text boxes (y = text vertical center)
  textBoxes.forEach((tb,i)=>{
    const cx = toCanvasX(tb.x||0);
    const cy = toCanvasY(tb.y||0);
    const sz = tb.size||48;
    ctx.font = `${sz}px "WenQuanYi Zen Hei",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = (tb.color||'white')+'CC';
    ctx.fillText(tb.text||'(空)', cx, cy);

    // Selection border
    if(selectedType==='text' && i===selectedIdx){
      const tw = ctx.measureText(tb.text||'(空)').width;
      ctx.strokeStyle='#0f3460'; ctx.lineWidth=2;
      ctx.strokeRect(cx-tw/2-8, cy-sz/2-2, tw+16, sz+4);
    }
  });

  // Guide lines (center snap feedback drawn on canvas)
  if(guideState==='x'||guideState==='both'){
    ctx.save();
    ctx.shadowColor='rgba(255,255,0,0.9)'; ctx.shadowBlur=14;
    ctx.strokeStyle='rgba(255,255,0,0.85)'; ctx.lineWidth=3;
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(CX,0); ctx.lineTo(CX,H); ctx.stroke();
    // inner darker line for contrast
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,200,0,0.6)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(CX,0); ctx.lineTo(CX,H); ctx.stroke();
    ctx.restore();
  }
  if(guideState==='y'||guideState==='both'){
    ctx.save();
    ctx.shadowColor='rgba(255,255,0,0.9)'; ctx.shadowBlur=14;
    ctx.strokeStyle='rgba(255,255,0,0.85)'; ctx.lineWidth=3;
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(0,CY); ctx.lineTo(W,CY); ctx.stroke();
    // inner darker line for contrast
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,200,0,0.6)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,CY); ctx.lineTo(W,CY); ctx.stroke();
    ctx.restore();
  }
}

const bgCache = {};
function loadBgToCache(url){
  if(!url || bgCache[url]) return;
  const img = new Image();
  img.onload = ()=>{ bgCache[url]=img; drawPreview(); };
  img.src = url;
}

// ── Snap & Guides ──
function snapBoth(cx, cy){
  // cx,cy are center-origin coords
  let sx=cx, sy=cy;
  guideState = null;

  let snapX=false, snapY=false;
  if(Math.abs(cx)<SNAP){ sx=0; snapX=true; }
  if(Math.abs(cy)<SNAP){ sy=0; snapY=true; }

  if(snapX && snapY) guideState = 'both';
  else if(snapX) guideState = 'x';
  else if(snapY) guideState = 'y';

  return [sx, sy];
}

// ── Canvas hit test ──
function hitTest(px, py){
  // Returns {type:'mat'} | {type:'text',index} | null
  // Check text boxes (top layer first)
  for(let i=textBoxes.length-1;i>=0;i--){
    const tb = textBoxes[i];
    const cx = toCanvasX(tb.x||0);
    const cy = toCanvasY(tb.y||0);
    const sz = tb.size||48;
    const tw = (tb.text||'').length * sz * 0.6;
    if(px>=cx-tw/2-8 && px<=cx+tw/2+8 && py>=cy-sz/2 && py<=cy+sz/2){
      return {type:'text', index:i};
    }
  }
  // Check material video
  if(matUrl){
    const mw=W, mh=Math.round(W*9/16);
    const mx=toCanvasX(matX) - mw/2;
    const my=toCanvasY(matY) - mh/2;
    if(px>=mx && px<=mx+mw && py>=my && py<=my+mh){
      return {type:'mat'};
    }
  }
  return null;
}

// ── Canvas events ──
canvas.addEventListener('mousedown', e=>{
  const pos = getCanvasXY(e);
  const hit = hitTest(pos.x, pos.y);
  if(hit && hit.type==='mat'){
    dragType='mat'; selectedType='mat'; selectedIdx=-1;
    dragOX=matX-pos.cx; dragOY=matY-pos.cy;
    isDragging=true; updatePropPanel(); drawPreview();
    return;
  }
  if(hit && hit.type==='text'){
    dragType='text'; dragIdx=hit.index; selectedType='text'; selectedIdx=hit.index;
    const tb = textBoxes[hit.index];
    dragOX=(tb.x||0)-pos.cx; dragOY=(tb.y||0)-pos.cy;
    isDragging=true; updatePropPanel(); drawPreview();
    return;
  }
  selectedType=''; selectedIdx=-1; updatePropPanel(); drawPreview();
});

canvas.addEventListener('mousemove', e=>{
  const pos = getCanvasXY(e);
  if(isDragging && dragType==='text' && dragIdx>=0){
    const [nx,ny] = snapBoth(Math.round(pos.cx+dragOX), Math.round(pos.cy+dragOY));
    textBoxes[dragIdx].x = nx;
    textBoxes[dragIdx].y = ny;
    updatePropPanel();
    drawPreview();
  }
  if(isDragging && dragType==='mat'){
    const [nx,ny] = snapBoth(Math.round(pos.cx+dragOX), Math.round(pos.cy+dragOY));
    matX=nx; matY=ny;
    updatePropPanel();
    drawPreview();
  }
  const info = document.getElementById('canvasInfo');
  info.textContent = `${pos.cx},${pos.cy} | ${W}×${H}`;
});

canvas.addEventListener('mouseup', ()=>{ isDragging=false; dragType=''; dragIdx=-1; guideState=null; drawPreview(); });
canvas.addEventListener('mouseleave', ()=>{ isDragging=false; dragType=''; dragIdx=-1; guideState=null; drawPreview(); });

function getCanvasXY(e){
  const rect = canvas.getBoundingClientRect();
  const px = Math.round((e.clientX-rect.left)*W/rect.width);
  const py = Math.round((e.clientY-rect.top)*H/rect.height);
  return {x:px, y:py, cx:px-CX, cy:py-CY};
}

// ── Text boxes ──
function addTextBox(){ textBoxes.push({text:'新文字',x:0,y:0,size:48,color:'#ffffff'}); renderBoxList(); drawPreview(); }
function removeTextBox(i){ textBoxes.splice(i,1); if(selectedIdx>=i && selectedType==='text'){selectedType='';selectedIdx=-1;} renderBoxList(); updatePropPanel(); drawPreview(); }
function renderBoxList(){
  document.getElementById('boxList').innerHTML = textBoxes.map((tb,i)=>`
    <div class="box-item${selectedType==='text'&&i===selectedIdx?' selected':''}" onclick="selectedType='text';selectedIdx=${i};updatePropPanel();drawPreview()">
      <div class="row">
        <span class="elem-badge">文字${i+1}</span>
        <input value="${tb.text}" onchange="textBoxes[${i}].text=this.value;drawPreview()" style="flex:1" placeholder="文字内容">
        <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();removeTextBox(${i})">×</button>
      </div>
    </div>
  `).join('');
}
function updatePropPanel(){
  const panel = document.getElementById('propPanel');
  const content = document.getElementById('propContent');

  // Material video properties
  if(selectedType==='mat'){
    panel.style.display='block';
    content.innerHTML = `
      <div style="font-size:13px;color:#e67e22;margin-bottom:8px">🎬 素材视频</div>
      <div class="row"><label>X</label><input type="number" value="${matX}" onchange="matX=+this.value;drawPreview()" style="width:80px"> <span style="font-size:10px;color:#888">中心原点</span></div>
      <div class="row"><label>Y</label><input type="number" value="${matY}" onchange="matY=+this.value;drawPreview()" style="width:80px"> <span style="font-size:10px;color:#888">中心原点</span></div>
    `;
    return;
  }

  if(selectedType!=='text'||selectedIdx<0||selectedIdx>=textBoxes.length){ panel.style.display='none'; return; }
  panel.style.display='block';
  const tb = textBoxes[selectedIdx];
  content.innerHTML = `
    <div style="font-size:13px;color:#0f3460;margin-bottom:8px">✏️ 文字${selectedIdx+1}</div>
    <div class="row"><label>X</label><input type="number" value="${tb.x}" onchange="textBoxes[${selectedIdx}].x=+this.value;drawPreview()" style="width:80px"> <span style="font-size:10px;color:#888">中心原点</span></div>
    <div class="row"><label>Y</label><input type="number" value="${tb.y}" onchange="textBoxes[${selectedIdx}].y=+this.value;drawPreview()" style="width:80px"> <span style="font-size:10px;color:#888">中心原点</span></div>
    <div class="row"><label>字号</label><input type="number" value="${tb.size}" onchange="textBoxes[${selectedIdx}].size=+this.value;drawPreview()" style="width:60px"></div>
    <div class="row"><label>颜色</label><input type="color" value="${tb.color}" onchange="textBoxes[${selectedIdx}].color=this.value;drawPreview()"></div>
  `;
}

// ── Upload ──
async function uploadBg(){
  const f=document.getElementById('bgFile').files[0]; if(!f) return;
  document.getElementById('bgStatus').textContent='上传中...';
  const fd=new FormData(); fd.append('file',f);
  const r=await fetch(API+'/bg/upload',{method:'POST',body:fd});
  const d=await r.json();
  bgUrl=d.url; loadBgToCache(bgUrl);
  document.getElementById('bgStatus').textContent='✅ '+f.name;
  drawPreview();
}
async function uploadMat(){
  const f=document.getElementById('matFile').files[0]; if(!f) return;
  document.getElementById('matStatus').textContent='上传中...';
  const fd=new FormData(); fd.append('file',f);
  const r=await fetch(API+'/bg/upload',{method:'POST',body:fd});
  const d=await r.json();
  matUrl=d.url; matBgId=d.bg_id;
  document.getElementById('matStatus').textContent='✅ '+f.name + ' (库)';
  drawPreview();
}

// ── Pipeline ──
function log(msg){ const el=document.getElementById('logBox'); el.textContent+=msg+'\n'; el.scrollTop=el.scrollHeight; }
function step(n,s){ const el=document.querySelector(`[data-step="${n}"]`); if(el) el.className='step '+s; }

async function startPipeline(){
  const script=document.getElementById('script').value.trim();
  if(!script){ alert('请输入文案'); return; }
  document.getElementById('startBtn').disabled=true;
  document.getElementById('logBox').textContent='';
  let progress=document.getElementById('progressBar');
  progress.value=0;

  try{
    // 1. TTS
    step(1,'active'); log('[1/5] 生成配音...');
    const provider=document.getElementById('ttsProvider').value;
    const voice = provider==='indextts' ? 'v1' : document.getElementById('ttsVoice').value;
    let fd=new FormData(); fd.append('text',script); fd.append('provider',provider); fd.append('voice',voice);
    let r=await fetch(API+'/tts',{method:'POST',body:fd}); let d=await r.json();
    audioUrl=d.url; log(`配音: ${d.duration.toFixed(1)}s`); step(1,'done'); progress.value=15;

    // 2. Trim
    step(2,'active'); log('[2/5] 裁剪静音...');
    fd=new FormData(); fd.append('audio_url',audioUrl);
    r=await fetch(API+'/trim',{method:'POST',body:fd}); d=await r.json();
    audioUrl=d.url; log(`裁剪完成`); step(2,'done'); progress.value=25;

    // 3. Align (文稿强制对齐)
    step(3,'active'); log('[3/5] 文稿对齐字幕...');
    fd=new FormData(); fd.append('audio_url',audioUrl); fd.append('language','zh'); fd.append('script',script);
    r=await fetch(API+'/align',{method:'POST',body:fd}); d=await r.json();
    srtUrl=d.url; log(`字幕: ${d.blocks}段 (${d.mode})`); step(3,'done'); progress.value=60;

    // 4. Compose
    step(4,'active'); log('[4/5] 合成视频...');
    fd=new FormData(); fd.append('audio_url',audioUrl); fd.append('subtitle_url',srtUrl);
    if(bgUrl) fd.append('bg_image_url',bgUrl);
    if(matUrl){ fd.append('material_video_url',matUrl); fd.append('material_x',matX); fd.append('material_y',matY); }
    if(matBgId){ fd.append('material_bg_id',matBgId); }
    fd.append('text_boxes',JSON.stringify(textBoxes.filter(t=>t.text.trim())));
    fd.append('subtitle_x',document.getElementById('subX').value);
    fd.append('subtitle_y',document.getElementById('subY').value);
    r=await fetch(API+'/compose',{method:'POST',body:fd}); d=await r.json();
    log(`合成完成! ${d.duration.toFixed(1)}s`); step(4,'done'); progress.value=100;

    // Show result
    log('🎉 全部完成! '+d.video_url);
  }catch(e){
    log('❌ '+e.message);
    document.querySelectorAll('.step.active').forEach(el=>el.className='step error');
  }finally{
    document.getElementById('startBtn').disabled=false;
  }
}

// Init
renderBoxList();
drawPreview();
</script>
