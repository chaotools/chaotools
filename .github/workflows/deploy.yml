name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-hub:
    name: Deploy Hub to Vercel
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build hub
        run: pnpm -r --filter @chaotools/hub build

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_HUB_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./hub

  deploy-tools:
    name: Deploy Tools to Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: chaotools-tools
          directory: ./tools
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-gateway:
    name: Deploy Gateway
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build gateway
        run: pnpm -r --filter @chaotools/gateway build

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/chaotools
            git pull
            pnpm install --frozen-lockfile
            pnpm -r --filter @chaotools/gateway build
            pm2 restart gateway || pm2 start gateway/dist/index.js --name gateway
