name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Type check types
        run: pnpm -r --filter @chaotools/types typecheck 
      - name: Type check sdk
        run: pnpm -r --filter @chaotools/sdk typecheck 
      - name: Type check gateway
        run: pnpm -r --filter @chaotools/gateway typecheck 
      - name: Type check hub
        run: pnpm -r --filter @chaotools/hub typecheck 
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter @chaotools/types build

      - name: Build SDK
        run: pnpm -r --filter @chaotools/sdk build

      - name: Build gateway
        run: pnpm -r --filter @chaotools/gateway build

      - name: Build hub
        run: pnpm -r --filter @chaotools/hub build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/*/dist
            hub/dist
            gateway/dist
          retention-days: 7
