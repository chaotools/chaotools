name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-review:
    name: PR Review Summary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PR Review
        uses: unwolf/comment-pr@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  check-changes:
    name: Check Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List changed files
        run: |
          echo "Changed files:"
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }}

      - name: Check tools changes
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -q "^tools/"; then
            echo "Tools directory changed - might need manual review"
          fi
