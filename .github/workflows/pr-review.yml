name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-review:
    name: PR Review Summary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post review summary
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const body = [
              '## Chaotools PR review',
              '',
              `Reviewed commit \`${pr.head.sha.slice(0, 7)}\` against \`${pr.base.sha.slice(0, 7)}\`.`,
              '',
              'Automated build, lint, manifest, and tool checks run in the other workflows.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  check-changes:
    name: Check Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed files
        run: |
          echo "Changed files:"
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

      - name: Check tools changes
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -q '^tools/'; then
            echo "Tools directory changed - manual review may be needed"
          else
            echo "No tools directory changes"
          fi
