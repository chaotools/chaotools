name: 💡 功能请求
description: 为 Chaotools 提出新功能建议
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 功能建议

        请描述你想要的功能。

  - type: textarea
    id: feature-description
    attributes:
      label: 功能描述
      description: 详细描述你建议的功能
      placeholder: "描述你想要的功能..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 为什么需要这个功能？
      description: 这个功能解决什么问题？
      placeholder: "描述动机..."

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过其他解决方案吗？
      placeholder: "其他替代方案..."
