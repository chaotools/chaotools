<style>
:root{--bg:#0a0e17;--surface:#111a2e;--border:rgba(56,189,248,.08);--border-hover:rgba(56,189,248,.2);--cyan:#38bdf8;--cyan-dim:rgba(56,189,248,.08);--text:#e2e8f0;--text-dim:#7f8ea3;--radius:12px;--green:#34d399}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:640px;margin:0 auto;padding:60px 20px 40px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);text-decoration:none;font-size:14px;margin-bottom:20px;transition:color .2s}
.back:hover{color:var(--brand, var(--cyan))}
h1{font-size:28px;font-weight:700;margin-bottom:6px;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:var(--text-dim);font-size:14px;margin-bottom:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px}
.drop-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:40px 20px;text-align:center;cursor:pointer;transition:all .2s}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--brand, var(--cyan));background:var(--cyan-dim)}
.drop-zone-icon{font-size:48px;margin-bottom:12px}
.drop-zone-text{color:var(--text-dim);font-size:14px}
.drop-zone-hint{color:var(--text-dim);font-size:12px;margin-top:6px}
input[type="file"]{display:none}
.preview-section{display:none;margin-top:20px}
.preview-section.show{display:block}
.preview-img{max-width:200px;max-height:200px;border-radius:8px;border:1px solid var(--border);margin-bottom:16px;display:block}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.info-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px}
.info-label{font-size:12px;color:var(--text-dim);margin-bottom:4px}
.info-value{font-size:14px;font-weight:600;color:var(--text);word-break:break-all}
.code-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:12px;line-height:1.5;word-break:break-all;max-height:200px;overflow-y:auto;color:var(--brand, var(--cyan));margin-bottom:12px;white-space:pre-wrap}
.actions{display:flex;gap:10px}
.btn{background:var(--brand, var(--cyan));color:#0a0e17;border:none;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s;flex:1;text-align:center}
.btn:hover{opacity:.85}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface);border:1px solid var(--border-hover);padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:480px){.container{padding:40px 16px 30px}.info-grid{grid-template-columns:1fr}}
</style>

<style>
.ct-unibar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:#544736;color:#f4ecdc;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;border-bottom:3px solid #2a251f;box-shadow:0 2px 0 rgba(0,0,0,.15)}

<div class="container"><h1>🖼 图片转 Base64</h1>
<p class="subtitle">拖入或选择图片，一键转换为 Base64 Data URL</p>
<div class="card">
<div class="drop-zone" id="dropZone">
<div class="drop-zone-icon">📁</div>
<div class="drop-zone-text">拖入图片到此处，或点击选择</div>
<div class="drop-zone-hint">支持 PNG / JPG / GIF / WebP / SVG</div>
<input type="file" id="fileInput" accept="image/*">
</div>
<div class="preview-section" id="previewSection">
<img id="previewImg" class="preview-img" alt="预览">
<div class="info-grid">
<div class="info-item"><div class="info-label">文件名</div><div class="info-value" id="fileName">-</div></div>
<div class="info-item"><div class="info-label">文件大小</div><div class="info-value" id="fileSize">-</div></div>
<div class="info-item"><div class="info-label">图片类型</div><div class="info-value" id="imageType">-</div></div>
<div class="info-item"><div class="info-label">编码后大小</div><div class="info-value" id="encodedSize">-</div></div>
</div>
<div class="code-block" id="base64Output"></div>
<div class="actions">
<button class="btn" id="copyBtn">复制 Data URL</button>
<button class="btn btn-secondary" id="resetBtn">重新选择</button>
</div>
</div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput'),previewSection=document.getElementById('previewSection'),previewImg=document.getElementById('previewImg'),fileName=document.getElementById('fileName'),fileSize=document.getElementById('fileSize'),imageType=document.getElementById('imageType'),encodedSize=document.getElementById('encodedSize'),base64Output=document.getElementById('base64Output'),copyBtn=document.getElementById('copyBtn'),resetBtn=document.getElementById('resetBtn'),toast=document.getElementById('toast');
let tT;function show(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>toast.classList.remove('show'),2000)}
function fmt(s){if(s<1024)return s+' B';if(s<1048576)return (s/1024).toFixed(1)+' KB';return (s/1048576).toFixed(2)+' MB'}
function proc(f){if(!f)return;const r=new FileReader();r.onload=function(e){const d=e.target.result;previewImg.src=d;fileName.textContent=f.name;fileSize.textContent=fmt(f.size);imageType.textContent=f.type||'未知';encodedSize.textContent=fmt(d.length)+' ('+(d.length/f.size*100).toFixed(0)+'%)';base64Output.textContent=d;previewSection.classList.add('show')};r.readAsDataURL(f)}
dropZone.addEventListener('click',()=>fileInput.click());
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('dragover')});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('dragover');const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))proc(f);else show('请选择图片文件')});
fileInput.addEventListener('change',()=>{if(fileInput.files[0])proc(fileInput.files[0])});
copyBtn.addEventListener('click',()=>{const t=base64Output.textContent;if(!t)return;navigator.clipboard.writeText(t).then(()=>show('已复制到剪贴板')).catch(()=>show('复制失败'))});
resetBtn.addEventListener('click',()=>{previewSection.classList.remove('show');fileInput.value='';base64Output.textContent=''});
</script>
<script src="/assets/counter.js" defer></script>
