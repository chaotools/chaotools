  <style>
    :root {
      --bg: #070b12;
      --surface: #0d1526;
      --border: rgba(56, 189, 248, 0.12);
      --cyan: #38bdf8;
      --text: #c8d6e5;
      --text-dim: #6b7d99;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: var(--brand, var(--cyan));
    }

    .desc {
      color: var(--text-dim);
      margin-bottom: 24px;
    }

    .search-box {
      position: relative;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      padding: 14px 14px 14px 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--brand, var(--cyan));
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--text-dim);
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .cat-btn {
      padding: 6px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-btn:hover {
      border-color: var(--brand, var(--cyan));
      color: var(--text);
    }

    .cat-btn.active {
      background: rgba(56, 189, 248, 0.1);
      border-color: var(--brand, var(--cyan));
      color: var(--brand, var(--cyan));
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 8px;
    }

    .emoji-item {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .emoji-item:hover {
      border-color: var(--brand, var(--cyan));
      transform: scale(1.1);
      background: rgba(56, 189, 248, 0.1);
    }

    .emoji-item.copied {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--brand, var(--cyan));
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--brand, var(--cyan));
      color: var(--bg);
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .stats {
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 16px;
    }
  </style>
  <link rel="stylesheet" href="/shared/enhanced.css">
</head>

    const emojiGrid = document.getElementById('emojiGrid');
    const stats = document.getElementById('stats');
    const toast = document.getElementById('toast');

    function renderEmojis(emojis) {
      emojiGrid.innerHTML = '';
      if (emojis.length === 0) {
        stats.textContent = '未找到匹配的 Emoji';
        return;
      }
      emojis.forEach(emoji => {
        const item = document.createElement('div');
        item.className = 'emoji-item';
        item.textContent = emoji;
        item.onclick = () => copyEmoji(item, emoji);
        emojiGrid.appendChild(item);
      });
      stats.textContent = `共 ${emojis.length} 个 Emoji`;
    }

    function setCategory(btn, cat) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = cat;
      searchInput.value = '';
      renderEmojis(EMOJI_MAP[cat] || []);
    }

    function copyEmoji(item, emoji) {
      navigator.clipboard.writeText(emoji);
      item.classList.add('copied');
      showToast(`✅ 已复制 ${emoji}`);
      setTimeout(() => item.classList.remove('copied'), 300);
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }

    function searchEmojis(query) {
      query = query.trim().toLowerCase();
      if (!query) {
        return EMOJI_MAP[currentCategory] || [];
      }

      // 如果搜索词匹配分类名
      if (EMOJI_MAP[query]) {
        return EMOJI_MAP[query];
      }

      // 按关键词搜索
      const results = [];
      for (const [emoji, keywords] of Object.entries(EMOJI_KEYWORDS)) {
        for (const keyword of keywords) {
          if (keyword.toLowerCase().includes(query)) {
            results.push(emoji);
            break;
          }
        }
      }
      return results;
    }

    searchInput.addEventListener('input', () => {
      const results = searchEmojis(searchInput.value);
      renderEmojis(results.slice(0, 100));
    });

    // Init
    renderEmojis(EMOJI_MAP['all'].slice(0, 100));
