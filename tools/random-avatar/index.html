<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机头像 - Chaotools</title>
  <style>
    :root {
      --bg: #070b12;
      --surface: #0d1526;
      --border: rgba(56, 189, 248, 0.12);
      --cyan: #38bdf8;
      --text: #c8d6e5;
      --text-dim: #6b7d99;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: var(--brand, var(--cyan));
    }

    .desc {
      color: var(--text-dim);
      margin-bottom: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 30px;
      text-align: center;
    }

    .avatar-container {
      width: 200px;
      height: 200px;
      margin: 0 auto 24px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--brand, var(--cyan));
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
    }

    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .seed-input {
      width: 100%;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
      text-align: center;
    }

    .seed-input:focus {
      border-color: var(--brand, var(--cyan));
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }

    .btn-primary {
      background: var(--brand, var(--cyan));
      color: var(--bg);
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--brand, var(--cyan));
    }

    .tips {
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-dim);
    }
  </style>
  <link rel="stylesheet" href="/shared/enhanced.css">
</head>
<body>
<!-- chaotools-unibar:start -->
<div class="ct-unibar">
  <a class="ct-unibar__brand" href="/">🛠️ Chaotools</a>
  <a class="ct-unibar__back" href="/">← 返回首页</a>
</div>
<style>
.ct-unibar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:rgba(10,14,23,.94);color:#e2e8f0;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;border-bottom:1px solid rgba(255,255,255,.08)}
.ct-unibar a{color:#e2e8f0;text-decoration:none;opacity:.88}
.ct-unibar a:hover{opacity:1;color:#38bdf8}
.ct-unibar__back{margin-left:auto}
</style>
<!-- chaotools-unibar:end -->

  <div class="container">
    <h1>🎭 随机头像</h1>
    <p class="desc">生成有趣的随机头像</p>

    <div class="card">
      <div class="avatar-container">
        <img id="avatarImg" src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=chaotools" alt="Random Avatar">
      </div>

      <input type="text" id="seedInput" class="seed-input" placeholder="输入种子词 (可选)" value="chaotools">

      <div class="btn-group">
        <button class="btn-primary" onclick="generateAvatar()">🎲 换一个</button>
        <button class="btn-secondary" onclick="downloadAvatar()">💾 下载</button>
      </div>

      <p class="tips">💡 使用相同种子会生成相同的头像</p>
    </div>
  </div>

  <script>
    const avatarImg = document.getElementById('avatarImg');
    const seedInput = document.getElementById('seedInput');

    const styles = [
      'bottts-neutral',
      'bottts',
      'avataaars',
      'personas',
      'pixel-art',
      'shapes',
      'icons',
      'lorelei',
      'micah',
      'miniavs'
    ];

    let currentStyle = 0;

    function generateAvatar() {
      const seed = seedInput.value.trim() || Math.random().toString(36).slice(2);
      seedInput.value = seed;

      // 轮换风格
      currentStyle = (currentStyle + 1) % styles.length;
      const style = styles[currentStyle];

      const timestamp = Date.now();
      avatarImg.src = `https://api.dicebear.com/7.x/${style}/svg?seed=${seed}&t=${timestamp}`;
    }

    function downloadAvatar() {
      const imgUrl = avatarImg.src;
      fetch(imgUrl)
        .then(res => res.blob())
        .then(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `avatar-${seedInput.value || 'chaotools'}.svg`;
          a.click();
          URL.revokeObjectURL(url);
        });
    }

    // 回车生成
    seedInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') generateAvatar();
    });
  </script>
<script src="/assets/counter.js" defer></script>

<div class="ct-toast" id="ctToast"></div>
<!-- chaotools-unifooter:start -->
<footer class="ct-unifooter">
  © 2026 Chaotools · 你的工具，你做主 ·
  <a href="/explore">探索工具</a> ·
  <a href="/message-board/">留言板</a>
</footer>
<style>
.ct-unifooter{margin-top:48px;padding:16px 12px;text-align:center;font-size:12px;color:#94a3b8;background:rgba(10,14,23,.94);border-top:1px solid rgba(255,255,255,.08);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
.ct-unifooter a{color:#94a3b8;text-decoration:none;margin:0 4px}
.ct-unifooter a:hover{color:#38bdf8}
</style>
<!-- chaotools-unifooter:end -->
</body>
</html>
