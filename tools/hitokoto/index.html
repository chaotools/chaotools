<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="description" content="随机获取经典「一言」或古今诗词佳句，可作签名与配图文案">
  <link rel="canonical" href="https://chaotools.tech/tools/hitokoto/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一言 / 诗句 - Chaotools</title>
  <style>
    :root {
      --bg: #070b12;
      --surface: #0d1526;
      --border: rgba(56, 189, 248, 0.12);
      --cyan: #38bdf8;
      --amber: #ffb800;
      --text: #c8d6e5;
      --text-dim: #6b7d99;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: var(--brand, var(--cyan));
    }

    .desc {
      color: var(--text-dim);
      margin-bottom: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 30px;
      margin-bottom: 16px;
    }

    .quote-box {
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 30px;
      text-align: center;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 2;
      cursor: pointer;
      transition: all 0.3s;
    }

    .quote-box:hover {
      border-color: var(--brand, var(--cyan));
      transform: scale(1.01);
    }

    .source {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: var(--amber);
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .cat-btn {
      padding: 6px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-btn:hover {
      border-color: var(--brand, var(--cyan));
      color: var(--text);
    }

    .cat-btn.active {
      background: rgba(56, 189, 248, 0.1);
      border-color: var(--brand, var(--cyan));
      color: var(--brand, var(--cyan));
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--brand, var(--cyan));
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 16px;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--bg);
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <link rel="stylesheet" href="/shared/enhanced.css">
<link rel="stylesheet" href="/toolbox-skin.css">
</head>
<body>
<!-- chaotools-unibar:start -->
<div class="ct-unibar">
  <a class="ct-unibar__brand" href="/">🛠️ Chaotools</a>
  <a class="ct-unibar__back" href="/">← 返回首页</a>
</div>
<style>
.ct-unibar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:#544736;color:#f4ecdc;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;border-bottom:3px solid #2a251f;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.ct-unibar__brand{font-weight:700;letter-spacing:.05em;color:#f4ecdc}
.ct-unibar a{color:#e6dcc8;text-decoration:none;opacity:.9}
.ct-unibar a:hover{opacity:1;color:#f2c300}
.ct-unibar__back{margin-left:auto}
</style>
<!-- chaotools-unibar:end -->

  <div class="container">
    <h1>📜 一言 / 诗句</h1>
    <p class="desc">随机获取一言或诗句</p>

    <div class="card">
      <div class="categories">
        <button class="cat-btn active" onclick="setCategory(this, '')">全部</button>
        <button class="cat-btn" onclick="setCategory(this, 'a')">动画</button>
        <button class="cat-btn" onclick="setCategory(this, 'b')">漫画</button>
        <button class="cat-btn" onclick="setCategory(this, 'c')">游戏</button>
        <button class="cat-btn" onclick="setCategory(this, 'd')">文学</button>
        <button class="cat-btn" onclick="setCategory(this, 'e')">原创</button>
        <button class="cat-btn" onclick="setCategory(this, 'f')">网络</button>
        <button class="cat-btn" onclick="setCategory(this, 'g')">哲学</button>
        <button class="cat-btn" onclick="setCategory(this, 'h')">诗句</button>
      </div>

      <div id="quoteBox" class="quote-box" onclick="fetchQuote()">
        点击获取一言
      </div>
      <p id="source" class="source"></p>

      <button id="genBtn" onclick="fetchQuote()">📜 随机一言</button>
    </div>
  </div>

  <script>
    let currentCat = '';
    let isLoading = false;

    function setCategory(btn, cat) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = cat;
      fetchQuote();
    }

    async function fetchQuote() {
      if (isLoading) return;

      const quoteBox = document.getElementById('quoteBox');
      const source = document.getElementById('source');
      const genBtn = document.getElementById('genBtn');

      isLoading = true;
      genBtn.disabled = true;
      genBtn.innerHTML = '<span class="loading"></span> 获取中...';
      quoteBox.textContent = '获取中...';
      source.textContent = '';

      try {
        const cat = currentCat ? `?c=${currentCat}` : '';
        const url = `https://v1.hitokoto.cn/${cat || '?encode=json'}`;

        const res = await fetch(url);
        if (!res.ok) throw new Error('网络错误');

        const data = await res.json();

        quoteBox.textContent = data.hitokoto || data.text || '获取失败';
        source.textContent = `—— ${data.from || data.from_who || '未知'} ${data.from_who ? `《${data.from}》` : ''}`;
      } catch (err) {
        quoteBox.textContent = '获取失败，请重试';
        source.textContent = '';
      } finally {
        isLoading = false;
        genBtn.disabled = false;
        genBtn.innerHTML = '📜 随机一言';
      }
    }

    // Init
    fetchQuote();
  </script>
<script src="/assets/counter.js" defer></script>

<div class="ct-toast" id="ctToast"></div>

.ct-unifooter a{color:#cfc4ac;text-decoration:none;margin:0 4px}
.ct-unifooter a:hover{color:#f2c300}
</style>
<!-- chaotools-unifooter:end -->
</body>
</html>
