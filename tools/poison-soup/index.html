  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>毒鸡汤 - Chaotools</title>
  <style>
    :root {
      --bg: #070b12;
      --surface: #0d1526;
      --border: rgba(56, 189, 248, 0.12);
      --cyan: #38bdf8;
      --red: #ff4757;
      --text: #c8d6e5;
      --text-dim: #6b7d99;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: var(--brand, var(--cyan));
    }

    .desc {
      color: var(--text-dim);
      margin-bottom: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 30px;
      margin-bottom: 16px;
    }

    .quote-box {
      background: linear-gradient(135deg, rgba(255, 71, 87, 0.08), rgba(255, 71, 87, 0.02));
      border: 1px solid rgba(255, 71, 87, 0.2);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .quote-text {
      font-size: 18px;
      line-height: 1.8;
      color: var(--text);
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ff4757, #ff6b7a);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .copy-btn {
      width: 100%;
      padding: 12px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 12px;
      transition: border-color 0.2s;
    }

    .copy-btn:hover {
      border-color: var(--brand, var(--cyan));
    }

    .stats {
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 16px;
    }
  </style>
  <link rel="stylesheet" href="/shared/enhanced.css">
<link rel="stylesheet" href="/toolbox-skin.css">
</head>
<body>
<!-- chaotools-unibar:start -->
<div class="ct-unibar">

<style>

  <div class="container">
    <h1>🧪 毒鸡汤</h1>
    <p class="desc">振奋人心的毒鸡汤，治愈精神内耗</p>

    <div class="card">
      <div class="quote-box">
        <p id="quoteText" class="quote-text">点击下方按钮生成毒鸡汤</p>
      </div>

      <button onclick="generate()">🧪 来一碗毒鸡汤</button>
      <button class="copy-btn" onclick="copyQuote()">📋 复制到剪贴板</button>
    </div>

    <p id="stats" class="stats"></p>
  </div>

  <script>

      "都说钱不是万能的，钱都买不到快乐，可我明明很不快乐啊。",

      "我也想embergass，但我的 embarrass 只会出现在英语成绩上。",
      "别人25岁就有所成就，你25岁还在工位上偷偷看手机。",
      "努力不一定有结果，但不努力一定很舒服，比如躺着的时候。",
      "我每次发誓要减肥，运动五分钟，休息两小时。",
      "有人说不要放弃，但我的体重从来没放弃过我。",

      "你的同龄人正在抛弃你，不是因为你不够努力，是因为你还在看手机。",

      "每天起床第一句：再睡五分钟。然后迟到了。",

      "有人说要活在当下，但我的当下只有加班。",
      "我不怕死亡，我怕的是我还没实现财富自由就要去领盒饭了。",
      "我最大的遗憾，是没有早点认识到自己是个普通人。",
      "所有的一夜成名，都是在积累了无数个失眠夜晚之后。",
      "有时候你已经很努力了，但结果还是不如意。所以别太努力，会累。",
      "人生就像心电图，一波三折才说明你还有的活。",
      "我曾经也是学霸，直到我接触了手机。",
      "有些事情不是努力就有用的，比如让渣男变专一。",
      "我讨厌励志，因为每次看完励志视频，我就更焦虑了。",
      "如果我能让所有人都满意，那我早就不用上班了。",
      "为什么有些人运气好，因为有些人把运气当实力。",
      "我知道生活很难，但easy模式的人生不是我的。",
      "我也想酷酷的，但我的钱包不允许。",
      "有人说要活成自己想要的样子，请问谁知道自己想要什么样子？"
    ];

    let usedIndices = [];
    let lastIndex = -1;

    function generate() {
      if (usedIndices.length >= quotes.length) {
        usedIndices = [];
      }

      let index;
      do {
        index = Math.floor(Math.random() * quotes.length);
      } while (usedIndices.includes(index) && usedIndices.length < quotes.length);

      usedIndices.push(index);
      lastIndex = index;

      document.getElementById('quoteText').textContent = quotes[index];
      document.getElementById('stats').textContent = `已阅读 ${usedIndices.length} / ${quotes.length} 条`;
    }

    function copyQuote() {
      const quote = document.getElementById('quoteText').textContent;
      if (quote && !quote.includes('点击')) {
        navigator.clipboard.writeText(quote);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = '✅ 已复制!';
        setTimeout(() => btn.textContent = '📋 复制到剪贴板', 1500);
      }
    }

    // Init
    generate();
  </script>
