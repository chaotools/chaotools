<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="template:media-width" content="1365">
<meta name="template:media-height" content="1365">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:1440px;height:2560px;
  margin:0;padding:0;
  overflow:hidden;
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  position:relative;
  background:#fafafa;
}
.bg-decoration{
  position:absolute;top:0;left:0;width:100%;height:100%;
  z-index:0;overflow:hidden;pointer-events:none;
}
.circle{position:absolute;border-radius:50%;border:3px solid rgba(44,62,80,0.12)}
.c1{width:467px;height:467px;top:10%;right:-133px}
.c2{width:373px;height:373px;bottom:15%;left:-107px}
.c3{width:240px;height:240px;top:50%;left:133px;border-color:rgba(149,165,166,0.15)}
.container{
  position:relative;z-index:1;
  width:100%;height:100%;
  padding:107px 80px 120px;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:80px;
}
.img-wrap{
  width:1365px;height:1365px;
  border-radius:32px;overflow:hidden;
  box-shadow:0 27px 80px rgba(0,0,0,0.15);
  flex-shrink:0;
}
.img-wrap img{width:100%;height:100%;object-fit:cover}
.title{
  font-size:69px;font-weight:700;color:#2c3e50;
  text-align:center;line-height:1.4;max-width:1280px;
}
.text{
  font-size:53px;color:#555;line-height:1.6;
  text-align:center;max-width:1280px;
}
.footer{
  position:absolute;bottom:53px;left:0;width:100%;
  text-align:center;font-size:37px;color:#999;
}
</style>
</head>
<body>
<div class="bg-decoration">
  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <div class="circle c3"></div>
</div>
<div class="container">
  <div class="title">{{title}}</div>
  <div class="img-wrap"><img src="{{image}}" alt="illustration"></div>
  <div class="text">{{text}}</div>
</div>
<div class="footer">{{author=@Pixelle.AI}}</div>
</body>
</html>
