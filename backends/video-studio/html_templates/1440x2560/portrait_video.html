<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="template:media-width" content="1365">
<meta name="template:media-height" content="1365">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:1440px;height:2560px;margin:0;padding:0;overflow:hidden;
  font-family:'WenQuanYi Zen Hei','Droid Sans Fallback',sans-serif;
  background:transparent;color:#fff;
  position:relative;
}

/* 顶部渐变装饰条 */
.top-bar{
  position:absolute;top:0;left:0;width:100%;height:347px;
  background:linear-gradient(180deg,rgba(0,0,0,0.5) 0%,transparent 100%);
  z-index:0;
}

/* 主标题区域 — 定位在顶部 */
.title-area{
  position:absolute;top:107px;left:80px;right:80px;z-index:1;
  text-align:center;
}
.main-title{
  font-size:75px;font-weight:700;color:#fff;
  line-height:1.3;text-shadow:0 5px 27px rgba(0,0,0,0.5);
  margin-bottom:21px;
}
.sub-title{
  font-size:40px;font-weight:400;color:rgba(255,255,255,0.7);
  line-height:1.4;letter-spacing:3px;
}

/* 中间视频/白场区域 */
.video-area{
  position:absolute;top:440px;left:40px;right:40px;
  height:1227px;
  border-radius:32px;overflow:hidden;
  background:rgba(0,0,0,0.3);
  box-shadow:0 13px 80px rgba(0,0,0,0.4);
  z-index:1;
}
.video-area img{
  width:100%;height:100%;object-fit:cover;
}
.video-placeholder{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.3);
  color:rgba(255,255,255,0.15);font-size:32px;
}

/* 双语字幕区域 */
.subtitle-area{
  position:absolute;top:1733px;left:80px;right:80px;
  text-align:center;z-index:1;
}
.sub-cn{
  font-size:43px;font-weight:700;color:#fff;
  line-height:1.5;text-shadow:0 3px 16px rgba(0,0,0,0.6);
  margin-bottom:5px;
}
.sub-en{
  font-size:29px;font-weight:400;color:rgba(255,255,255,0.65);
  line-height:1.4;letter-spacing:1px;
}

/* 底部提示文字 */
.footer-area{
  position:absolute;bottom:133px;left:0;width:100%;
  text-align:center;z-index:1;
}
.hint-line1{
  font-size:35px;color:rgba(255,255,255,0.5);
  letter-spacing:4px;margin-bottom:11px;
}
.hint-line2{
  font-size:27px;color:rgba(255,255,255,0.35);
  letter-spacing:3px;
}

/* 底部装饰线 */
.bottom-line{
  position:absolute;bottom:80px;left:50%;
  transform:translateX(-50%);
  width:267px;height:3px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);
  z-index:1;
}
</style>
</head>
<body>
<div class="top-bar"></div>

<div class="title-area">
  <div class="main-title">{{title}}</div>
  <div class="sub-title">{{text}}</div>
</div>

<div class="video-area">
  <img src="{{image}}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
  <div class="video-placeholder" style="display:none">🎬 背景视频</div>
</div>

<div class="subtitle-area">
  <div class="sub-cn">{{sub_cn:文字=中文双语字幕}}</div>
  <div class="sub-en">{{sub_en:文字=English Subtitle}}</div>
</div>

<div class="footer-area">
  <div class="hint-line1">{{hint1:文字=点个关注 下期更精彩}}</div>
  <div class="hint-line2">{{hint2:文字=点赞·转发·收藏}}</div>
</div>

<div class="bottom-line"></div>

<script>
  // 模板变量说明（不会出现在渲染结果中）
  // {{title}}    — 主标题（取自文案第一句）
  // {{text}}     — 副标题
  // {{image}}    — 背景视频封面
  // {{sub_cn}}   — 中文双语字幕行
  // {{sub_en}}   — 英文字幕行
  // {{hint1}}    — 底部提示第一行
  // {{hint2}}    — 底部提示第二行
</script>
</body>
</html>
