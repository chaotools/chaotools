<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="template:media-width" content="1365">
<meta name="template:media-height" content="1365">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:1440px;height:2560px;margin:0;padding:0;
  overflow:hidden;position:relative;
  font-family:'WenQuanYi Zen Hei','Droid Sans Fallback',sans-serif;
  background:transparent;
  color:#fff;text-shadow:0 2px 12px rgba(0,0,0,0.7);
}
.container{
  width:100%;height:100%;
  padding:107px 80px;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  gap:53px;
}
.title{
  font-size:75px;font-weight:700;
  text-align:center;line-height:1.4;
  max-width:1280px;margin-bottom:27px;
  text-shadow:0 5px 27px rgba(0,0,0,0.5);
}
.img-wrap{
  width:1365px;height:1365px;
  border-radius:21px;overflow:hidden;
  box-shadow:0 13px 53px rgba(0,0,0,0.3);
  flex-shrink:0;
}
.img-wrap img{width:100%;height:100%;object-fit:cover}
.text{
  font-size:51px;color:rgba(255,255,255,0.85);
  line-height:1.6;text-align:center;
  max-width:1280px;
}
</style>
</head>
<body>
<div class="container">
  <div class="title">{{title}}</div>
  <div class="img-wrap"><img src="{{image}}" alt="illustration"></div>
  <div class="text">{{text}}</div>
</div>
</body>
</html>
