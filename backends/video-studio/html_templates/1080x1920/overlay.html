<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="template:media-width" content="1440">
<meta name="template:media-height" content="2560">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:1440px;height:2560px;margin:0;padding:0;overflow:hidden;
  font-family:"WenQuanYi Zen Hei","Droid Sans Fallback",sans-serif;
  background:transparent;color:#fff;position:relative;
}
/* 顶部渐变遮罩 */
.top-gradient{
  position:absolute;top:0;left:0;width:100%;height:450px;
  background:linear-gradient(180deg,rgba(0,0,0,0.75) 0%,transparent 100%);
  z-index:0;
}
/* 底部渐变遮罩 */
.bottom-gradient{
  position:absolute;bottom:0;left:0;width:100%;height:350px;
  background:linear-gradient(0deg,rgba(0,0,0,0.7) 0%,transparent 100%);
  z-index:0;
}
.title{
  position:absolute;top:80px;left:80px;right:80px;z-index:1;
  font-size:64px;font-weight:700;text-align:center;
  text-shadow:0 4px 24px rgba(0,0,0,0.9);
  line-height:1.3;letter-spacing:2px;
}
.text{
  position:absolute;top:190px;left:80px;right:80px;z-index:1;
  font-size:34px;font-weight:400;text-align:center;
  color:rgba(255,255,255,0.88);
  text-shadow:0 2px 16px rgba(0,0,0,0.7);
  line-height:1.5;
}
.author{
  position:absolute;bottom:60px;left:0;width:100%;text-align:center;
  font-size:24px;color:rgba(255,255,255,0.4);z-index:1;
}
</style></head>
<body>
<div class="top-gradient"></div>
<div class="bottom-gradient"></div>
<div class="title">{{title}}</div>
<div class="text">{{text}}</div>
<div class="author">{{author=@Pixelle.AI}}</div>
</body></html>
