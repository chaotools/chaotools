<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="template:media-width" content="1024">
<meta name="template:media-height" content="1024">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:1080px;height:1920px;
  margin:0;padding:0;
  overflow:hidden;
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  position:relative;
  background:#fafafa;
}
.bg-decoration{
  position:absolute;top:0;left:0;width:100%;height:100%;
  z-index:0;overflow:hidden;pointer-events:none;
}
.circle{position:absolute;border-radius:50%;border:2px solid rgba(44,62,80,0.12)}
.c1{width:350px;height:350px;top:10%;right:-100px}
.c2{width:280px;height:280px;bottom:15%;left:-80px}
.c3{width:180px;height:180px;top:50%;left:100px;border-color:rgba(149,165,166,0.15)}
.container{
  position:relative;z-index:1;
  width:100%;height:100%;
  padding:80px 60px 90px;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:60px;
}
.img-wrap{
  width:1024px;height:1024px;
  border-radius:24px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.15);
  flex-shrink:0;
}
.img-wrap img{width:100%;height:100%;object-fit:cover}
.title{
  font-size:52px;font-weight:700;color:#2c3e50;
  text-align:center;line-height:1.4;max-width:960px;
}
.text{
  font-size:40px;color:#555;line-height:1.6;
  text-align:center;max-width:960px;
}
.footer{
  position:absolute;bottom:40px;left:0;width:100%;
  text-align:center;font-size:28px;color:#999;
}
</style>
</head>
<body>
<div class="bg-decoration">
  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <div class="circle c3"></div>
</div>
<div class="container">
  <div class="title">{{title}}</div>
  <div class="img-wrap"><img src="{{image}}" alt="illustration"></div>
  <div class="text">{{text}}</div>
</div>
<div class="footer">{{author=@Pixelle.AI}}</div>
</body>
</html>
