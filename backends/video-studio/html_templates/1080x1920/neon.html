<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="template:media-width" content="1365">
<meta name="template:media-height" content="1365">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:1440px;height:2560px;margin:0;padding:0;
  overflow:hidden;position:relative;
  font-family:'WenQuanYi Zen Hei','Droid Sans Fallback',sans-serif;
  background:transparent;
  color:#fff;
}
.glow{
  position:absolute;width:800px;height:800px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(0,255,255,0.08) 0%, transparent 70%);
  top:20%;right:-133px;z-index:0;
}
.container{
  position:relative;z-index:1;
  width:100%;height:100%;
  padding:80px 67px;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  gap:67px;
}
.img-wrap{
  width:1280px;height:1280px;
  border-radius:43px;overflow:hidden;
  box-shadow:0 27px 107px rgba(0,0,0,0.5);
  border:3px solid rgba(255,255,255,0.1);
  flex-shrink:0;
}
.img-wrap img{width:100%;height:100%;object-fit:cover}
.title{
  font-size:64px;font-weight:700;
  text-align:center;line-height:1.4;
  max-width:1280px;
  background:linear-gradient(90deg,#00d2ff,#928dab);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.text{
  font-size:48px;color:rgba(255,255,255,0.8);
  line-height:1.6;text-align:center;
  max-width:1280px;
}
.tagline{
  position:absolute;bottom:67px;
  font-size:32px;color:rgba(255,255,255,0.3);
  text-align:center;width:100%;
}
</style>
</head>
<body>
<div class="glow"></div>
<div class="container">
  <div class="title">{{title}}</div>
  <div class="img-wrap"><img src="{{image}}" alt="illustration"></div>
  <div class="text">{{text}}</div>
</div>
<div class="tagline">{{tagline=AI Generated}}</div>
</body>
</html>
