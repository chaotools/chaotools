<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="description" content="随机数生成 + 名单抽奖，带抽取动画和历史记录">
  <link rel="canonical" href="https://chaotools.tech/random-picker/">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>随机数 / 抽奖器 - Chaotools</title>
<style>
:root{--bg:#0a0e17;--surface:#111a2e;--border:rgba(56,189,248,.08);--border-hover:rgba(56,189,248,.2);--cyan:#38bdf8;--cyan-dim:rgba(56,189,248,.08);--text:#e2e8f0;--text-dim:#7f8ea3;--radius:12px;--green:#34d399}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:560px;margin:0 auto;padding:60px 20px 40px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);text-decoration:none;font-size:14px;margin-bottom:20px;transition:color .2s}
.back:hover{color:var(--brand, var(--cyan))}
h1{font-size:28px;font-weight:700;margin-bottom:6px;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:var(--text-dim);font-size:14px;margin-bottom:24px}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:8px;margin-bottom:20px}
.tab{padding:8px 20px;border-radius:6px;font-size:14px;cursor:pointer;color:var(--text-dim);border:none;background:none;transition:all .2s;flex:1;text-align:center}
.tab.active{background:var(--surface);color:var(--text);font-weight:600}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px}
label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;font-weight:500}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;padding:10px 14px;outline:none;font-family:inherit;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--brand, var(--cyan))}
.row{display:flex;gap:12px;margin-bottom:16px}.row .field{flex:1}
textarea{resize:vertical;min-height:120px;line-height:1.6;font-family:monospace;font-size:13px}
.result-box{display:flex;align-items:center;justify-content:center;min-height:120px;background:var(--bg);border:1px solid var(--border);border-radius:12px;margin:16px 0;font-size:48px;font-weight:800;color:var(--brand, var(--cyan));transition:all .1s;overflow:hidden;position:relative}
.result-box.spinning{animation:pulse .1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.result-box .placeholder{font-size:16px;font-weight:400;color:var(--text-dim)}
.btn{background:var(--brand, var(--cyan));color:#0a0e17;border:none;padding:12px 28px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s;display:block;width:100%}
.btn:hover{opacity:.85}.btn:disabled{opacity:.4;cursor:not-allowed}
.history{font-size:13px;color:var(--text-dim);margin-top:12px}
.history span{display:inline-block;background:var(--bg);padding:3px 10px;border-radius:6px;margin:3px 4px 3px 0;font-family:monospace}
@media(max-width:480px){.container{padding:40px 16px 30px}.row{flex-direction:column}}
</style>
  <link rel="stylesheet" href="/shared/enhanced.css?v=20260814-1045">
<link rel="stylesheet" href="/toolbox-skin.css?v=20260814-1045">
  <script defer src="/shared/tool-shell.js?v=20260814-1045">
  </script>
</head>
<body class="ct-tool-page" data-tool-id="random-picker" data-tool-family="utility">

<div class="ct-unibar">
  <a class="ct-unibar__brand" href="/">🛠️ Chaotools</a>
  <a class="ct-unibar__back" href="/">← 返回首页</a>
</div>
<style>
.ct-unibar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:#544736;color:#f4ecdc;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;border-bottom:3px solid #2a251f;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.ct-unibar__brand{font-weight:700;letter-spacing:.05em;color:#f4ecdc}
.ct-unibar a{color:#e6dcc8;text-decoration:none;opacity:.9}
.ct-unibar a:hover{opacity:1;color:#f2c300}
.ct-unibar__back{margin-left:auto}
</style>
<!-- chaotools-unibar:end -->

<div class="container"><h1>🎲 随机数 / 抽奖器</h1>
<p class="subtitle">随机数生成 + 名单抽奖，二合一</p>
<div class="tabs"><button class="tab active" data-tab="number">数字模式</button><button class="tab" data-tab="list">名单模式</button></div>
<div class="card" id="numberTab">
<div class="row"><div class="field"><label>最小值</label><input type="number" id="minVal" value="1"></div><div class="field"><label>最大值</label><input type="number" id="maxVal" value="100"></div></div>
<div class="result-box" id="numResult"><span class="placeholder">点击抽取</span></div>
<button class="btn" id="numBtn">🎲 抽取</button>
<div class="history" id="numHistory"></div>
</div>
<div class="card" id="listTab" style="display:none">
<label>名单（每行一个）</label>
<textarea id="listInput" placeholder="张三&#10;李四&#10;王五&#10;赵六">张三
李四
王五
赵六</textarea>
<div class="result-box" id="listResult"><span class="placeholder">点击抽取</span></div>
<button class="btn" id="listBtn">🎯 抽奖</button>
<div class="history" id="listHistory"></div>
</div>
</div>
<script>
const tabs=document.querySelectorAll('.tab'),numberTab=document.getElementById('numberTab'),listTab=document.getElementById('listTab');
tabs.forEach(t=>{t.addEventListener('click',()=>{tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');numberTab.style.display=t.dataset.tab==='number'?'block':'none';listTab.style.display=t.dataset.tab==='list'?'block':'none'})});
const minVal=document.getElementById('minVal'),maxVal=document.getElementById('maxVal'),numBtn=document.getElementById('numBtn'),numResult=document.getElementById('numResult'),numHistory=document.getElementById('numHistory');
const listInput=document.getElementById('listInput'),listBtn=document.getElementById('listBtn'),listResult=document.getElementById('listResult'),listHistory=document.getElementById('listHistory');
let numHist=[],listHist=[];
function animatePick(el,finalVal,callback){el.classList.add('spinning');let count=0;const iv=setInterval(()=>{const r=Math.floor(Math.random()*9999);el.textContent=r;count++;if(count>15){clearInterval(iv);el.classList.remove('spinning');el.textContent=finalVal;if(callback)setTimeout(callback,10)}},60)}
numBtn.addEventListener('click',()=>{const mn=parseInt(minVal.value)||0,mx=parseInt(maxVal.value)||100;if(mn>mx){numResult.textContent='最小值不能大于最大值';return}const r=Math.floor(Math.random()*(mx-mn+1))+mn;animatePick(numResult,r,()=>{numHist.unshift(r);if(numHist.length>5)numHist.pop();numHistory.innerHTML='最近: '+numHist.map(x=>'<span>'+x+'</span>').join('')})});
listBtn.addEventListener('click',()=>{const lines=listInput.value.split('\n').map(l=>l.trim()).filter(Boolean);if(lines.length===0){listResult.innerHTML='<span class=placeholder>名单为空</span>';return}const r=lines[Math.floor(Math.random()*lines.length)];animatePick(listResult,r,()=>{listHist.unshift(r);if(listHist.length>5)listHist.pop();listHistory.innerHTML='最近: '+listHist.map(x=>'<span>'+x+'</span>').join('')})});
</script>
<script src="/assets/counter.js" defer></script>
