  <style>
    :root { --bg: #0a0e17; --surface: #111a2e; --border: rgba(56,189,248,.08); --border-hover: rgba(56,189,248,.2); --cyan: #38bdf8; --cyan-dim: rgba(56,189,248,.08); --text: #e2e8f0; --text-dim: #7f8ea3; --radius: 12px; --green: #34d399; --green-dim: rgba(52,211,153,.1); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; padding: 60px 20px 40px; }
    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-dim); text-decoration: none; font-size: 14px; margin-bottom: 20px; transition: color .2s; }
    .back:hover { color: var(--brand, var(--cyan)); }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; background: linear-gradient(135deg,#38bdf8,#818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 28px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: var(--text); }
    label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
    .input-row { display: flex; gap: 10px; align-items: flex-end; }
    .input-row input, .input-row select { flex: 1; }
    input, select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; padding: 10px 14px; outline: none; transition: border-color .2s; }
    input:focus, select:focus { border-color: var(--brand, var(--cyan)); }
    input[readonly] { color: var(--brand, var(--cyan)); font-family: "SF Mono", "Fira Code", monospace; cursor: pointer; }
    .btn { background: var(--brand, var(--cyan)); color: #0a0e17; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity .2s; }
    .btn:hover { opacity: .85; }
    .btn-sm { padding: 8px 14px; font-size: 13px; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--brand, var(--cyan)); }
    .result-grid { display: grid; gap: 12px; }
    .result-item { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .result-label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
    .result-value { font-size: 14px; color: var(--text); font-family: "SF Mono", "Fira Code", monospace; word-break: break-all; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .copy-btn { background: none; border: none; color: var(--brand, var(--cyan)); cursor: pointer; font-size: 13px; padding: 2px 8px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
    .copy-btn:hover { background: var(--cyan-dim); }
    .now-btn { display: flex; align-items: center; gap: 6px; color: var(--brand, var(--cyan)); cursor: pointer; font-size: 13px; background: none; border: 1px dashed var(--border); border-radius: 8px; padding: 10px 16px; margin-top: 12px; transition: border-color .2s; }
    .now-btn:hover { border-color: var(--brand, var(--cyan)); }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface); border: 1px solid var(--border-hover); padding: 10px 20px; border-radius: 8px; font-size: 14px; opacity: 0; transition: all .3s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 480px) { .container { padding: 40px 16px 30px; } .input-row { flex-direction: column; } }

  <div class="container"><h1>🕒 时间戳转换器</h1>
    <p class="subtitle">Unix 时间戳 ↔ 日期时间互转，支持秒/毫秒</p>

    <div class="card">
      <div class="card-title">时间戳 → 日期</div>
      <div class="input-row">
        <input type="number" id="tsInput" placeholder="输入时间戳" step="1">
        <select id="tsUnit">
          <option value="seconds">秒</option>
          <option value="milliseconds" selected>毫秒</option>
        </select>
        <button class="btn btn-sm" id="tsConvertBtn">转换</button>
      </div>
      <button class="now-btn" id="nowBtn">📌 填入当前时间戳</button>
    </div>

    <div class="card" id="resultCard" style="display:none">
      <div class="card-title">转换结果</div>
      <div class="result-grid">
        <div class="result-item">
          <div class="result-label">本地时间</div>
          <div class="result-value"><span id="localTime"></span></div>
        </div>
        <div class="result-item">
          <div class="result-label">UTC 时间</div>
          <div class="result-value"><span id="utcTime"></span></div>
        </div>
        <div class="result-item">
          <div class="result-label">原时间戳</div>
          <div class="result-value">
            <span id="origTimestamp"></span>
            <button class="copy-btn" onclick="copyText(document.getElementById('origTimestamp').textContent)">复制</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">日期 → 时间戳</div>
      <div class="input-row">
        <input type="datetime-local" id="dtInput">
        <button class="btn btn-sm" id="dtConvertBtn">转换</button>
      </div>
    </div>

    <div class="card" id="dtResultCard" style="display:none">
      <div class="card-title">转换结果</div>
      <div class="result-grid">
        <div class="result-item">
          <div class="result-label">秒级时间戳</div>
          <div class="result-value">
            <span id="secondsTs"></span>
            <button class="copy-btn" onclick="copyText(document.getElementById('secondsTs').textContent)">复制</button>
          </div>
        </div>
        <div class="result-item">
          <div class="result-label">毫秒级时间戳</div>
          <div class="result-value">
            <span id="millisecondsTs"></span>
            <button class="copy-btn" onclick="copyText(document.getElementById('millisecondsTs').textContent)">复制</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const tsInput = document.getElementById('tsInput');
    const tsUnit = document.getElementById('tsUnit');
    const tsConvertBtn = document.getElementById('tsConvertBtn');
    const resultCard = document.getElementById('resultCard');
    const localTime = document.getElementById('localTime');
    const utcTime = document.getElementById('utcTime');
    const origTimestamp = document.getElementById('origTimestamp');
    const nowBtn = document.getElementById('nowBtn');
    const dtInput = document.getElementById('dtInput');
    const dtConvertBtn = document.getElementById('dtConvertBtn');
    const dtResultCard = document.getElementById('dtResultCard');
    const secondsTs = document.getElementById('secondsTs');
    const millisecondsTs = document.getElementById('millisecondsTs');
    const toast = document.getElementById('toast');

    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg; toast.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => showToast('已复制')).catch(() => showToast('复制失败'));
    }

    function pad(n) { return String(n).padStart(2, '0'); }
    function formatDate(d) {
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function convertTs() {
      const raw = tsInput.value.trim();
      if (!raw) { resultCard.style.display = 'none'; return; }
      const val = parseFloat(raw);
      if (isNaN(val)) { resultCard.style.display = 'none'; return; }
      const ms = tsUnit.value === 'seconds' ? val * 1000 : val;
      const d = new Date(ms);
      if (d.toString() === 'Invalid Date') { resultCard.style.display = 'none'; return; }
      localTime.textContent = formatDate(d);
      utcTime.textContent = d.toISOString().replace('T', ' ').replace('Z', ' UTC');
      origTimestamp.textContent = raw;
      resultCard.style.display = 'block';
    }

    function convertDt() {
      const val = dtInput.value;
      if (!val) { dtResultCard.style.display = 'none'; return; }
      const d = new Date(val);
      if (d.toString() === 'Invalid Date') { dtResultCard.style.display = 'none'; return; }
      secondsTs.textContent = Math.floor(d.getTime() / 1000);
      millisecondsTs.textContent = d.getTime();
      dtResultCard.style.display = 'block';
    }

    tsConvertBtn.addEventListener('click', convertTs);
    tsInput.addEventListener('keydown', e => { if (e.key === 'Enter') convertTs(); });

    nowBtn.addEventListener('click', () => {
      const now = Date.now();
      tsInput.value = now;
      tsUnit.value = 'milliseconds';
      convertTs();
    });

    dtConvertBtn.addEventListener('click', convertDt);

    // Set default datetime to now
    const now = new Date();
    const defVal = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
    dtInput.value = defVal;
    convertDt();
  </script>
<script src="/assets/counter.js" defer></script>
