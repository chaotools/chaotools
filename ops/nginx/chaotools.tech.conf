limit_req_zone $binary_remote_addr zone=chaotools_api:10m rate=20r/s;
server_tokens off;

server {
    server_name chaotools.tech www.chaotools.tech;
    root /var/www/current;
    index index.html index.htm;
    server_tokens off;
    if ($host = www.chaotools.tech) {
        return 301 https://chaotools.tech$request_uri;
    }
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; upgrade-insecure-requests; object-src 'none'; base-uri 'self'; frame-src 'self'" always;
    add_header Cache-Control "no-cache" always;

    # 禁止暴露隐藏文件与 git 目录
    location ~ /\.git { deny all; }
    location ~ ^/\.(?!well-known) { deny all; }
    # 禁止直接访问依赖目录、网关数据目录与密钥文件
    location ^~ /node_modules/ { deny all; }
    location ^~ /gateway/data/ { deny all; }
    location ~ /\.(env|jwt-secret)$ { deny all; }
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; upgrade-insecure-requests; object-src 'none'; base-uri 'self'; frame-src 'self'" always;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /audio-trimmer { return 301 /audio-trimmer/; }
    location /audio-trimmer/ {
        limit_req zone=chaotools_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 200m;
    }
    location = /pixabay { return 301 /pixabay/; }
    location /srt-replace {
        if ($host = "152.136.48.140") { return 404; }
        try_files $uri $uri/ =404;
    }
    location = /srt-translator { return 301 /srt-translator/; }
    location = /message-board { return 301 /message-board/; }
    # 旧根路径工具入口 → 301 到 /tools/ 下真实页面
    location ~* ^/(json-formatter|color-converter|regex-tester|base64-codec|uuid-generator|rainbow-fart|random-avatar|poison-soup|hitokoto)(/?)$ {
        return 301 /tools/$1/;
    }

    # 龙虎榜游资分析（独立 Python 后端 :8000）
    location = /lhb-analyzer { return 301 /lhb-analyzer/; }
    location /lhb-analyzer/ {
        limit_req zone=chaotools_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Video Studio API → GPU 服务器
    location /api-studio/ {
        limit_req zone=chaotools_api burst=60 nodelay;
        rewrite ^/api-studio/(.*) /api/$1 break;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        client_max_body_size 10g;
    }

    # Video Studio outputs
    location ^~ /outputs/ {
        limit_req zone=chaotools_api burst=120 nodelay;
        proxy_pass http://127.0.0.1:8765/outputs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }
    location /api/message-board/ {
        limit_req zone=chaotools_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3456/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API 路径必须在静态扩展名正则规则前确定路由；例如已鉴权的
    # /api/love-vault/media/...jpg 不能被当作站点静态图片直接返回 404。
    location ^~ /api/ {
        limit_req zone=chaotools_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8899/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    # Gateway API（登录/注册/收藏同步）
    # Public liveness probe for the gateway process.
    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:3001/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }

    location /gateway/ {
        limit_req zone=chaotools_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    # SPA 真实路由
    location = / { try_files /index.html =404; }
    location = /explore { try_files /index.html =404; }
    location = /my-tools { try_files /index.html =404; }
    location = /login { try_files /index.html =404; }
    location = /register { try_files /index.html =404; }
    location ~ ^/tool/[A-Za-z0-9_-]+/?$ { try_files /index.html =404; }

    # 其余路径：存在才返回，不存在一律 404（不再软 404）
    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/chaotools.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chaotools.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

}

# HTTP → HTTPS（保留 ACME 验证路径）
server {
    listen 80;
    listen [::]:80;
    server_name chaotools.tech www.chaotools.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://chaotools.tech$request_uri;
    }
}
